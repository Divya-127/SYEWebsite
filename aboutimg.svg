  <!-- Bottom decorative elements - textile manufacturing process icons -->
  <g transform="translate(150, 350)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#3498db" stroke-width="2" />
    <path d="M-7,-7 L7,7 M-7,7 L7,-7" stroke="#3498db" stroke-width="2" />
