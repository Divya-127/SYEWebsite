<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="200" fill="#f8f9fa" />

  <!-- Title -->
  <text x="200" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Specialty Pretreatment</text>

  <!-- First Container Group -->
  <g transform="translate(30, 50) scale(0.45)">
    <!-- Container 1 - Bleach Stabilizer -->
    <g>
      <!-- Container body - round flask -->
      <path d="M50,80 C50,65 65,65 80,50 C95,65 110,65 110,80 V200 C110,220 90,230 80,230 C70,230 50,220 50,200 Z" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <path d="M55,85 C55,72 67,72 80,60 C93,72 105,72 105,85 V195 C105,212 90,222 80,222 C70,222 55,212 55,195 Z" fill="#e67e22" opacity="0.7" />
      <!-- Flask neck -->
      <rect x="73" y="30" width="14" height="20" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <!-- Flask cap -->
      <rect x="70" y="20" width="20" height="10" rx="2" fill="#555" />
      <!-- Label -->
      <rect x="50" y="120" width="60" height="80" rx="5" fill="white" stroke="#333" />
      <text x="80" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">BLEACH</text>
      <text x="80" y="153" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">STABILIZER</text>
      <text x="80" y="180" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Anti-catalytic</text>
    </g>

    <!-- Icon -->
    <rect x="30" y="250" width="100" height="30" rx="3" fill="#e67e22" />
    <text x="80" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="white">STABILIZER</text>
  </g>

  <!-- Second Container Group -->
  <g transform="translate(110, 50) scale(0.45)">
    <!-- Container 2 - Sequestering Agent -->
    <g>
      <!-- Container body - triangular flask -->
      <path d="M55,60 L40,190 C40,210 60,230 80,230 C100,230 120,210 120,190 L105,60 Z" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <path d="M60,70 L48,185 C48,202 65,222 80,222 C95,222 112,202 112,185 L100,70 Z" fill="#16a085" opacity="0.7" />
      <!-- Flask neck -->
      <rect x="73" y="40" width="14" height="20" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <!-- Flask cap -->
      <rect x="70" y="30" width="20" height="10" rx="2" fill="#555" />
      <!-- Label -->
      <rect x="50" y="120" width="60" height="80" rx="5" fill="white" stroke="#333" />
      <text x="80" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">SEQUESTERING</text>
      <text x="80" y="153" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">AGENT</text>
      <text x="80" y="180" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">EDTA Based</text>
    </g>

    <!-- Icon -->
    <rect x="30" y="250" width="100" height="30" rx="3" fill="#16a085" />
    <text x="80" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SEQUESTRANT</text>
  </g>

  <!-- Third Container Group -->
  <g transform="translate(190, 50) scale(0.45)">
    <!-- Container 3 - Anti-creasing Agent -->
    <g>
      <!-- Container body - rectangular bottle -->
      <rect x="40" y="40" width="80" height="180" rx="8" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <rect x="45" y="45" width="70" height="170" rx="6" fill="#8e44ad" opacity="0.7" />
      <!-- Container top -->
      <path d="M65,40 L65,25 H95 L95,40" fill="none" stroke="#333" stroke-width="2" />
      <rect x="65" y="15" width="30" height="10" rx="3" fill="#555" />
      <!-- Label -->
      <rect x="50" y="120" width="60" height="80" rx="5" fill="white" stroke="#333" />
      <text x="80" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">ANTI</text>
      <text x="80" y="153" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">CREASING</text>
      <text x="80" y="180" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Polyacrylamide</text>
    </g>

    <!-- Icon -->
    <rect x="30" y="250" width="100" height="30" rx="3" fill="#8e44ad" />
    <text x="80" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="white">ANTI-CREASE</text>
  </g>

  <!-- Fourth Container Group -->
  <g transform="translate(270, 50) scale(0.45)">
    <!-- Container 4 - Wetting Agent -->
    <g>
      <!-- Container body - droplet shaped bottle -->
      <path d="M80,40 C50,40 40,90 40,130 C40,190 60,230 80,230 C100,230 120,190 120,130 C120,90 110,40 80,40 Z" fill="#f8f8f8" stroke="#333" stroke-width="2" />
      <path d="M80,45 C55,45 45,92 45,130 C45,185 63,222 80,222 C97,222 115,185 115,130 C115,92 105,45 80,45 Z" fill="#3498db" opacity="0.7" />
      <!-- Container cap -->
      <rect x="70" y="30" width="20" height="10" rx="5" fill="#555" />
      <!-- Label -->
      <rect x="50" y="120" width="60" height="80" rx="5" fill="white" stroke="#333" />
      <text x="80" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">WETTING</text>
      <text x="80" y="153" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">AGENT</text>
      <text x="80" y="180" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Non-ionic</text>
    </g>

    <!-- Icon -->
    <rect x="30" y="250" width="100" height="30" rx="3" fill="#3498db" />
    <text x="80" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="white">WETTING</text>
  </g>

  <!-- Water Drop Elements -->
  <g transform="translate(350, 160)">
    <path d="M0,15 C0,5 10,0 15,5 C20,0 30,5 30,15 C30,25 20,30 15,25 C10,30 0,25 0,15 Z" fill="#3498db" opacity="0.6" />
    <path d="M10,0 C10,-5 15,-8 20,-5 C25,-8 30,-5 30,0 C30,5 25,8 20,5 C15,8 10,5 10,0 Z" fill="#3498db" opacity="0.6" />
  </g>

  <!-- Molecular Chain Elements -->
  <g transform="translate(15, 160)">
    <circle cx="0" cy="0" r="3" fill="#333" />
    <circle cx="10" cy="0" r="3" fill="#333" />
    <circle cx="20" cy="0" r="3" fill="#333" />
    <circle cx="5" cy="10" r="3" fill="#333" />
    <circle cx="15" cy="10" r="3" fill="#333" />
    <circle cx="25" cy="10" r="3" fill="#333" />
    <line x1="0" y1="0" x2="10" y2="0" stroke="#333" stroke-width="1" />
    <line x1="10" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1" />
    <line x1="5" y1="10" x2="15" y2="10" stroke="#333" stroke-width="1" />
    <line x1="15" y1="10" x2="25" y2="10" stroke="#333" stroke-width="1" />
    <line x1="0" y1="0" x2="5" y2="10" stroke="#333" stroke-width="1" />
    <line x1="10" y1="0" x2="15" y2="10" stroke="#333" stroke-width="1" />
    <line x1="20" y1="0" x2="25" y2="10" stroke="#333" stroke-width="1" />
  </g>
</svg>